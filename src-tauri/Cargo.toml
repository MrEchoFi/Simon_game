[package]
name = "retro-simon-tauri"
version = "1.0.0"
description = "Retro Simon memory game built with Tauri and Rust"
authors = ["Retro Arcade Lab"]
edition = "2021"

[lib]
name = "retro_simon_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
